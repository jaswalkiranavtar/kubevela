apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: manifestworks.work.open-cluster-management.io
spec:
  group: work.open-cluster-management.io
  names:
    kind: ManifestWork
    listKind: ManifestWorkList
    plural: manifestworks
    shortNames:
      - mw
      - mws
    singular: manifestwork
  scope: Namespaced
  preserveUnknownFields: false
  versions:
    - additionalPrinterColumns:
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1
      schema:
        openAPIV3Schema:
          description: ManifestWork represents a manifests workload that hub wants to deploy on the managed cluster.
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              description: Spec represents the desired configuration of work.
              type: object
              properties:
                deleteOption:
                  description: DeleteOption represents deletion strategy when the manifestwork is deleted.
                  type: object
                  properties:
                    propagationPolicy:
                      description: PropagationPolicy can be Foreground, Orphan or SelectivelyOrphan.
                      type: string
                      default: Foreground
                      enum:
                        - Foreground
                        - Orphan
                        - SelectivelyOrphan
                    selectivelyOrphans:
                      description: SelectivelyOrphan represents a list of resources following orphan deletion stratecy
                      type: object
                      properties:
                        orphaningRules:
                          type: array
                          items:
                            type: object
                            properties:
                              group:
                                type: string
                              name:
                                type: string
                              namespace:
                                type: string
                              resource:
                                type: string
                executor:
                  description: Executor is the configuration that makes the work agent to perform some pre-request processing/checking.
                  type: object
                  properties:
                    subject:
                      description: Subject is the subject identity which the work agent uses to talk to the local cluster.
                      type: object
                      required:
                        - type
                      properties:
                        serviceAccount:
                          description: ServiceAccount is for identifying which service account to use by the work agent.
                          type: object
                          required:
                            - name
                            - namespace
                          properties:
                            name:
                              type: string
                            namespace:
                              type: string
                        type:
                          description: Type is the type of the subject identity.
                          type: string
                          enum:
                            - ServiceAccount
                manifestConfigs:
                  description: ManifestConfigs represents the configurations of manifests defined in workload field.
                  type: array
                  items:
                    type: object
                    required:
                      - resourceIdentifier
                    properties:
                      feedbackRules:
                        description: FeedbackRules defines what resource status field should be returned.
                        type: array
                        items:
                          type: object
                          required:
                            - type
                          properties:
                            jsonPaths:
                              type: array
                              items:
                                type: object
                                required:
                                  - name
                                  - path
                                properties:
                                  name:
                                    type: string
                                  path:
                                    type: string
                                  version:
                                    type: string
                            type:
                              type: string
                              enum:
                                - WellKnownStatus
                                - JSONPaths
                      resourceIdentifier:
                        description: ResourceIdentifier represents the group, resource, name and namespace of a resource.
                        type: object
                        required:
                          - name
                          - resource
                        properties:
                          group:
                            type: string
                          name:
                            type: string
                          namespace:
                            type: string
                          resource:
                            type: string
                      updateStrategy:
                        description: UpdateStrategy defines the strategy to update this manifest.
                        type: object
                        required:
                          - type
                        properties:
                          serverSideApply:
                            description: serverSideApply defines the configuration for server side apply.
                            type: object
                            properties:
                              fieldManager:
                                type: string
                                default: work-agent
                              force:
                                type: boolean
                          type:
                            type: string
                            default: Update
                            enum:
                              - Update
                              - CreateOnly
                              - ServerSideApply
                workload:
                  description: Workload represents the manifest workload to be deployed on a managed cluster.
                  type: object
                  properties:
                    manifests:
                      description: Manifests represents a list of kuberenetes resources to be deployed on a managed cluster.
                      type: array
                      items:
                        description: Manifest represents a resource to be deployed on managed cluster.
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                        x-kubernetes-embedded-resource: true
            status:
              description: Status represents the current status of work.
              type: object
              properties:
                conditions:
                  description: Conditions contains the different condition statuses for this work.
                  type: array
                  items:
                    type: object
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    properties:
                      lastTransitionTime:
                        type: string
                        format: date-time
                      message:
                        type: string
                        maxLength: 32768
                      observedGeneration:
                        type: integer
                        format: int64
                        minimum: 0
                      reason:
                        type: string
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      type:
                        type: string
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                resourceStatus:
                  description: ResourceStatus represents the status of each resource in workload.
                  type: object
                  properties:
                    manifests:
                      description: Manifests represents the condition of manifests deployed on a managed cluster.
                      type: array
                      items:
                        type: object
                        properties:
                          conditions:
                            description: Conditions represents the conditions of this resource on a managed cluster.
                            type: array
                            items:
                              type: object
                              required:
                                - lastTransitionTime
                                - message
                                - reason
                                - status
                                - type
                              properties:
                                lastTransitionTime:
                                  type: string
                                  format: date-time
                                message:
                                  type: string
                                  maxLength: 32768
                                observedGeneration:
                                  type: integer
                                  format: int64
                                  minimum: 0
                                reason:
                                  type: string
                                  maxLength: 1024
                                  minLength: 1
                                  pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                                status:
                                  type: string
                                  enum:
                                    - "True"
                                    - "False"
                                    - Unknown
                                type:
                                  type: string
                                  maxLength: 316
                                  pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                          resourceMeta:
                            description: ResourceMeta represents the group, version, kind, name and namespace of a resource.
                            type: object
                            properties:
                              group:
                                type: string
                              kind:
                                type: string
                              name:
                                type: string
                              namespace:
                                type: string
                              ordinal:
                                type: integer
                              resource:
                                type: string
                              version:
                                type: string
                          statusFeedback:
                            description: StatusFeedback represents the values of the feild synced back defined in statusFeedbacks
                            type: object
                            properties:
                              values:
                                type: array
                                items:
                                  type: object
                                  required:
                                    - fieldValue
                                    - name
                                  properties:
                                    fieldValue:
                                      type: object
                                      required:
                                        - type
                                      properties:
                                        boolean:
                                          type: boolean
                                        integer:
                                          type: integer
                                          format: int64
                                        jsonRaw:
                                          type: string
                                        string:
                                          type: string
                                        type:
                                          type: string
                                          enum:
                                            - Integer
                                            - String
                                            - Boolean
                                            - JsonRaw
                                    name:
                                      type: string
      served: true
      storage: true
      subresources:
        status: {}
status:
  acceptedNames:
    kind: ""
    plural: ""
  conditions: []
  storedVersions: []
